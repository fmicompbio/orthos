on:
  workflow_dispatch:
  push:
  pull_request:
    branches:
      - devel
  schedule:
    - cron: '0 8 * * 1'

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    container: ${{ matrix.config.image }}

    name: ${{ matrix.config.os }} (${{ matrix.config.bioc }} - ${{ matrix.config.image }})

    strategy:
      fail-fast: false
      matrix:
        config:
        - { os: macos-latest, bioc: 'devel', curlConfigPath: '/usr/bin/'}
        - { os: macos-15-intel, bioc: 'devel', curlConfigPath: '/usr/bin/'}
        - { os: windows-latest, bioc: 'devel'}
        - { os: ubuntu-24.04-arm, bioc: 'devel'}
        - { os: ubuntu-latest, image: "bioconductor/bioconductor_docker:devel", cran: "https://demo.rstudiopm.com/all/__linux__/xenial/latest"}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      _R_CHECK_FORCE_SUGGESTS_: false
      CRAN: ${{ matrix.config.cran }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # BASILISK_MINICONDA_VERSION: ${{ matrix.config.miniconda }}
      # CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      # CURL_CONFIG: ${{ matrix.config.curlConfigPath }}curl-config
      ORTHOS_MODEL_EVAL: 1
      cache-version: v1

    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Install OpenSSL
        if: matrix.config.os == 'macos-latest'
        run: brew install openssl@3

      - name: Configure Makevars
        if: matrix.config.os == 'macos-latest'
        run: |
          mkdir -p ~/.R
          cat <<EOF > ~/.R/Makevars
          CPPFLAGS=-I/opt/homebrew/opt/openssl@3/include
          LDFLAGS=-L/opt/homebrew/opt/openssl@3/lib
          EOF
          
      - name: Configure environment for OpenSSL
        if: matrix.config.os == 'macos-latest'
        run: |
          echo "LDFLAGS=-L/opt/homebrew/opt/openssl@3/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I/opt/homebrew/opt/openssl@3/include" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/opt/homebrew/opt/openssl@3/lib/pkgconfig" >> $GITHUB_ENV

      - name: Set up tinytex
        if: runner.os == 'Linux' && matrix.config.image == null
        uses: r-lib/actions/setup-tinytex@v2
        env:
          TINYTEX_INSTALLER: TinyTeX
          
      - name: Set up R and install BiocManager
        uses: grimbough/bioc-actions/setup-bioc@v1
        if: matrix.config.image == null
        with:
          bioc-version: ${{ matrix.config.bioc }}

      - name: Set up pandoc
        uses: r-lib/actions/setup-pandoc@v2
        if: matrix.config.image == null

      - name: Install remotes
        run: |
          install.packages('remotes')
        shell: Rscript {0}

      - name: Query dependencies
        run: |
          saveRDS(remotes::dev_package_deps(dependencies = TRUE, repos = c(getOption('repos'), BiocManager::repositories())), 'depends.Rds', version = 2)
        shell: Rscript {0}

      - name: Cache R packages
        if: runner.os != 'Windows' && matrix.config.image == null
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ env.cache-version }}-${{ matrix.config.os }}-bioc-${{ matrix.config.bioc }}-${{ hashFiles('depends.Rds') }}
          restore-keys: ${{ env.cache-version }}-${{ matrix.config.os }}-bioc-${{ matrix.config.bioc }}-

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux' && matrix.config.image == null
        #env:
        #  RHUB_PLATFORM: linux-x86_64-ubuntu-gcc
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          pak-version: devel
          
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install harfbuzz
          brew install fribidi

      - name: Install dependencies
        run: |
          local_deps <- remotes::local_package_deps(dependencies = TRUE)
          deps <- remotes::dev_package_deps(dependencies = TRUE, repos = BiocManager::repositories())
          BiocManager::install(local_deps[local_deps %in% deps$package[deps$diff != 0]], Ncpu = 2L)
          remotes::install_cran('rcmdcheck', Ncpu = 2L)
        shell: Rscript {0}

      - name: Session info
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}

      - name: Build, Install, Check
        id: build-install-check
        uses: grimbough/bioc-actions/build-install-check@v1

      - name: Upload install log if the build/install/check step fails
        if: always() && (steps.build-install-check.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with: 
          name: install-log
          path: |
            ${{ steps.build-install-check.outputs.install-log }}
            
      - name: Show testthat output (windows)
        if: matrix.config.os == 'windows-latest'
        run: |
            type ${{ steps.build-install-check.outputs.check-dir }}\tests\testthat.Rout
        shell: cmd

      - name: Show testthat output (non-windows)
        if: matrix.config.os != 'windows-latest'
        run: |
            cat ${{ steps.build-install-check.outputs.check-dir }}/tests/testthat.Rout
        shell: bash

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@master
        with:
          name: ${{ runner.os }}-bioc${{ matrix.config.bioc }}-results
          path: ${{ steps.build-install-check.outputs.check-dir }}
          
      - name: Run BiocCheck
        uses: grimbough/bioc-actions/run-BiocCheck@v1
        with:
          error-on: 'never'
          arguments: '--no-check-bioc-views --no-check-bioc-help'

      - name: Test coverage
        if: matrix.config.os == 'ubuntu-latest'
        run: |
          install.packages("covr")
          covr::codecov(token = "${{secrets.CODECOV_TOKEN}}")
        shell: Rscript {0}

      - name: List virtual environment content
        run: |
          dput(basilisk::listPackages(basilisk::obtainEnvironmentPath(orthos:::orthosenv))[, "full"])
        shell: Rscript {0}

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/devel' && matrix.config.os == 'macos-latest'
        run: |
          R CMD INSTALL .
          Rscript -e "remotes::install_cran('pkgdown'); pkgdown::deploy_to_branch(new_process = FALSE)"
